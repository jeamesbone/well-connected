name: Scrape Connections Words

on:
  schedule:
    # 12:10 UTC daily — 10 minutes after midnight in GMT-12 (UTC-12)
    - cron: '10 12 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run scraper
        run: uv run python main.py

      # The page is the only thing that can explain a failed scrape, and it is
      # gone once the runner is torn down. Keep it.
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-failure-${{ github.run_number }}
          path: debug/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit words file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/

          if git diff --staged --quiet; then
            echo "Archive unchanged -- nothing to commit."
            exit 0
          fi

          DATE=$(basename "$(git diff --staged --name-only | head -1)" .json)
          git commit -m "chore: add connections words for $DATE"

          # The checkout can be behind by the time we push: run 207 lost a
          # puzzle to "! [rejected] main -> main (fetch first)". Rebase onto
          # whatever landed and retry rather than dropping the scrape.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed $DATE on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main."
            git pull --rebase origin main
          done

          echo "Could not push $DATE after 3 attempts." >&2
          exit 1
