name: Scrape Connections Words

on:
  schedule:
    # 5:10 AM UTC daily — 10 minutes after midnight ET (UTC-5 in winter, UTC-4 in summer)
    - cron: '10 5 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run scraper
        run: uv run python main.py

      - name: Commit words file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/
          NEW_FILE=$(git status -s archive/ | head -1 | awk '{print $2}')
          DATE=$(basename "$NEW_FILE" .json)
          git diff --staged --quiet || (git commit -m "chore: add connections words for $DATE" && git push)
